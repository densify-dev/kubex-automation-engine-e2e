apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-kubex-gpu-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mock-kubex-gpu-exporter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mock-kubex-gpu-exporter
subjects:
  - kind: ServiceAccount
    name: mock-kubex-gpu-exporter
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mock-kubex-gpu-exporter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mock-kubex-gpu-exporter
  namespace: monitoring
  labels:
    app: mock-kubex-gpu-exporter
spec:
  selector:
    matchLabels:
      app: mock-kubex-gpu-exporter
  template:
    metadata:
      labels:
        app: mock-kubex-gpu-exporter
    spec:
      serviceAccountName: mock-kubex-gpu-exporter
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: exporter
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 8080
          command: ["python", "-u", "-c"]
          args:
            - |
              import json
              import os
              import ssl
              import urllib.parse
              import urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer

              NODE_NAME = os.environ.get("NODE_NAME", "")
              API_HOST = os.environ["KUBERNETES_SERVICE_HOST"]
              API_PORT = os.environ["KUBERNETES_SERVICE_PORT_HTTPS"]
              TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              with open(TOKEN_PATH, encoding="utf-8") as token_file:
                  TOKEN = token_file.read().strip()

              def build_metrics():
                  query = urllib.parse.quote(f"spec.nodeName={NODE_NAME}", safe="=")
                  url = f"https://{API_HOST}:{API_PORT}/api/v1/pods?fieldSelector={query}"
                  request = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
                  context = ssl.create_default_context(cafile=CA_PATH)
                  with urllib.request.urlopen(request, context=context, timeout=10) as response:
                      payload = json.load(response)

                  lines = []
                  for pod in payload.get("items", []):
                      metadata = pod.get("metadata", {})
                      spec = pod.get("spec", {})
                      namespace = metadata.get("namespace", "default")
                      pod_name = metadata.get("name", "")
                      annotations = metadata.get("annotations", {})
                      sm_value = annotations.get("mock.kubex.ai/kubex_gpu_container_sm_utilization_percent")
                      memory_value = annotations.get("mock.kubex.ai/kubex_gpu_container_memory_utilization_percent")

                      if sm_value is None and memory_value is None:
                          continue

                      for container in spec.get("containers", []):
                          container_name = container.get("name", "")
                          labels = f'namespace="{namespace}",pod="{pod_name}",container="{container_name}"'
                          if sm_value is not None:
                              lines.append(
                                  f"kubex_gpu_container_sm_utilization_percent{{{labels}}} {sm_value}"
                              )
                          if memory_value is not None:
                              lines.append(
                                  f"kubex_gpu_container_memory_utilization_percent{{{labels}}} {memory_value}"
                              )

                  return "\n".join(lines) + ("\n" if lines else "")

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404)
                          self.end_headers()
                          return

                      try:
                          body = build_metrics()
                          status = 200
                          content_type = "text/plain; version=0.0.4; charset=utf-8"
                      except Exception as exc:
                          body = str(exc)
                          status = 500
                          content_type = "text/plain"

                      payload = body.encode("utf-8")
                      self.send_response(status)
                      self.send_header("Content-Type", content_type)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

                  def log_message(self, format, *args):
                      return

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: mock-kubex-gpu-exporter
  namespace: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: mock-kubex-gpu-exporter
  ports:
    - protocol: TCP
      port: 8080
      targetPort: metrics
  type: ClusterIP
