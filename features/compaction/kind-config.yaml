kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: e2e-compaction
networking:
  # Non-overlapping CIDRs for hosts that run a real cluster on the default
  # 10.96.0.0/12 service range (e.g. kubeadm default). Pods use 10.201.0.0/16
  # to avoid conflict with any host 10.244.0.0/16 pod CIDR as well.
  serviceSubnet: "10.200.0.0/16"
  podSubnet: "10.201.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
