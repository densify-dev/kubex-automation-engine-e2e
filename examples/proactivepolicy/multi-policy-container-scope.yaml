# GlobalConfiguration.spec.multiPolicyContainerRightsizingEnabled must be true.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: multi-policy-proactive-container-scope-strategy
  namespace: default
spec:
  podEviction:
    enabled: true
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ProactivePolicy
metadata:
  name: multi-policy-proactive-app
  namespace: default
spec:
  scope:
    containers:
      - app
    labelSelector:
      matchLabels:
        app: multi-policy-proactive-container-scope-demo
  automationStrategyRef:
    name: multi-policy-proactive-container-scope-strategy
  safetyChecks:
    maxAnalysisAgeDays: 365
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ProactivePolicy
metadata:
  name: multi-policy-proactive-sidecar
  namespace: default
spec:
  scope:
    containers:
      - sidecar
    labelSelector:
      matchLabels:
        app: multi-policy-proactive-container-scope-demo
  automationStrategyRef:
    name: multi-policy-proactive-container-scope-strategy
  safetyChecks:
    maxAnalysisAgeDays: 365
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-policy-proactive-container-scope-demo
  namespace: default
  labels:
    app: multi-policy-proactive-container-scope-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-policy-proactive-container-scope-demo
  template:
    metadata:
      labels:
        app: multi-policy-proactive-container-scope-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: metrics
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
