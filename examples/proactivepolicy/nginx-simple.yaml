---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: nginx-automation-strategy
  namespace: nginx
spec: {}
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ProactivePolicy
metadata:
  name: nginx-proactive-policy
  namespace: nginx
spec:
  scope:
    labelSelector:
      matchLabels:
        app: nginx
  automationStrategyRef:
    name: nginx-automation-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
