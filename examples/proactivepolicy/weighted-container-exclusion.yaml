# GlobalConfiguration.spec.multiPolicyContainerRightsizingEnabled must be true.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: weighted-proactive-container-exclusion-default
  namespace: default
spec: {}
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: weighted-proactive-container-exclusion-disabled
  namespace: default
spec:
  enablement:
    cpu:
      requests:
        downsize: false
        upsize: false
        setFromUnspecified: false
      limits:
        downsize: false
        upsize: false
        setFromUnspecified: false
    memory:
      requests:
        downsize: false
        upsize: false
        setFromUnspecified: false
      limits:
        downsize: false
        upsize: false
        setFromUnspecified: false
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ProactivePolicy
metadata:
  name: weighted-proactive-container-exclusion-default
  namespace: default
spec:
  weight: 10
  scope:
    labelSelector:
      matchLabels:
        app: weighted-proactive-container-exclusion-demo
  automationStrategyRef:
    name: weighted-proactive-container-exclusion-default
  safetyChecks:
    maxAnalysisAgeDays: 365
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ProactivePolicy
metadata:
  name: weighted-proactive-container-exclusion-sidecar
  namespace: default
spec:
  weight: 20
  scope:
    containers:
      - sidecar
    labelSelector:
      matchLabels:
        app: weighted-proactive-container-exclusion-demo
  automationStrategyRef:
    name: weighted-proactive-container-exclusion-disabled
  safetyChecks:
    maxAnalysisAgeDays: 365
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weighted-proactive-container-exclusion-demo
  namespace: default
  labels:
    app: weighted-proactive-container-exclusion-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weighted-proactive-container-exclusion-demo
  template:
    metadata:
      labels:
        app: weighted-proactive-container-exclusion-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
