---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: simulate-client-rate-limit-automation-strategy
  namespace: default
spec: {}
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: simulate-client-rate-limit-rightsizing-policy
  namespace: default
spec:
  scope:
    labelSelector:
      matchLabels:
        app: rightsizing-demo-rate-limit
  resources:
    containers:
      "*":
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
  automationStrategyRef:
    name: simulate-client-rate-limit-automation-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rightsizing-demo-rate-limit
  namespace: default
  labels:
    app: rightsizing-demo-rate-limit
  annotations:
    automation-webhook.kubex.ai/simulate-client-rate-limit: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rightsizing-demo-rate-limit
  template:
    metadata:
      labels:
        app: rightsizing-demo-rate-limit
      annotations:
        automation-webhook.kubex.ai/simulate-client-rate-limit: "true"
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
