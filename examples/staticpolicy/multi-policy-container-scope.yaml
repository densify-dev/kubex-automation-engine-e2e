apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: multi-policy-container-scope-strategy
  namespace: default
spec: {}
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: multi-policy-app
  namespace: default
spec:
  scope:
    containers:
      - app
    labelSelector:
      matchLabels:
        app: multi-policy-container-scope-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  automationStrategyRef:
    name: multi-policy-container-scope-strategy
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: multi-policy-sidecar
  namespace: default
spec:
  scope:
    containers:
      - sidecar
    labelSelector:
      matchLabels:
        app: multi-policy-container-scope-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 150m
          memory: 192Mi
        limits:
          cpu: 300m
          memory: 384Mi
  automationStrategyRef:
    name: multi-policy-container-scope-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-policy-container-scope-demo
  namespace: default
  labels:
    app: multi-policy-container-scope-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-policy-container-scope-demo
  template:
    metadata:
      labels:
        app: multi-policy-container-scope-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: metrics
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
