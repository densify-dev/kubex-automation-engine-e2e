apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: weighted-container-exclusion-default
  namespace: default
spec: {}
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: weighted-container-exclusion-disabled
  namespace: default
spec:
  enablement:
    cpu:
      requests:
        downsize: false
        upsize: false
        setFromUnspecified: false
      limits:
        downsize: false
        upsize: false
        setFromUnspecified: false
    memory:
      requests:
        downsize: false
        upsize: false
        setFromUnspecified: false
      limits:
        downsize: false
        upsize: false
        setFromUnspecified: false
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: weighted-container-exclusion-default
  namespace: default
spec:
  weight: 10
  scope:
    labelSelector:
      matchLabels:
        app: weighted-container-exclusion-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  automationStrategyRef:
    name: weighted-container-exclusion-default
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: weighted-container-exclusion-sidecar
  namespace: default
spec:
  weight: 20
  scope:
    containers:
      - sidecar
    labelSelector:
      matchLabels:
        app: weighted-container-exclusion-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 300m
          memory: 384Mi
        limits:
          cpu: 600m
          memory: 768Mi
  automationStrategyRef:
    name: weighted-container-exclusion-disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weighted-container-exclusion-demo
  namespace: default
  labels:
    app: weighted-container-exclusion-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weighted-container-exclusion-demo
  template:
    metadata:
      labels:
        app: weighted-container-exclusion-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
