apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: container-skip-automation-strategy
  namespace: default
spec:
  safetyChecks:
    enablePauseUntilAnnotationCheck: true
  podEviction:
    enabled: false
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: container-skip-policy
  namespace: default
spec:
  scope:
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: container-skip-demo
  resources:
    containers:
      app:
        requests:
          cpu: 300m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
      sidecar:
        requests:
          cpu: 75m
          memory: 96Mi
        limits:
          cpu: 150m
          memory: 192Mi
  automationStrategyRef:
    name: container-skip-automation-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-skip-owner-level
  namespace: default
  labels:
    app.kubernetes.io/name: container-skip-owner-level
    app.kubernetes.io/part-of: container-skip-demo
  annotations:
    rightsizing.kubex.ai/skip-containers: "app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: container-skip-owner-level
      app.kubernetes.io/part-of: container-skip-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-skip-owner-level
        app.kubernetes.io/part-of: container-skip-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
