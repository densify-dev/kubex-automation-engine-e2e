---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-vanilla-2kai
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: gpu-vanilla-2kai-strategy
  namespace: gpu-vanilla-2kai
spec:
  experimental:
    gpuKaiContract: v1alpha1-2026-04
  enablement:
    gpu:
      overrideScheduler: "kai"
      requests:
        downsize: true
        upsize: true
        setFromUnspecified: false
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: gpu-vanilla-2kai-policy
  namespace: gpu-vanilla-2kai
spec:
  scope:
    labelSelector:
      matchLabels:
        app: gpu-vanilla-2kai-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 200m
          memory: 256Mi
          gpu: "0.7"
        limits:
          cpu: 600m
          memory: 1Gi
  automationStrategyRef:
    name: gpu-vanilla-2kai-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-vanilla-2kai-demo
  namespace: gpu-vanilla-2kai
  labels:
    app: gpu-vanilla-2kai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-vanilla-2kai-demo
  template:
    metadata:
      labels:
        app: gpu-vanilla-2kai-demo
      annotations:
        mock.kubex.ai/gpu-uuid: "GPU-mock-001"
        mock.kubex.ai/kubex_gpu_container_sm_utilization_percent: "72.5"
        mock.kubex.ai/kubex_gpu_container_memory_utilization_percent: "48"
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
              nvidia.com/gpu: 2
            limits:
              cpu: 700m
              memory: 1200Mi
              nvidia.com/gpu: 2
