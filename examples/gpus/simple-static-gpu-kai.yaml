---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-kai
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: gpu-kai-strategy
  namespace: gpu-kai
spec:
  experimental:
    gpuKaiContract: v1alpha1-2026-07
  enablement:
    overrideScheduler: "kai"
    gpu:
      requests:
        downsize: true
        upsize: true
        setFromUnspecified: false
  kai:
    setQueueWhenSpecified: false
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: gpu-kai-policy
  namespace: gpu-kai
spec:
  scope:
    labelSelector:
      matchLabels:
        app: gpu-kai-demo
  resources:
    containers:
      "*":
        requests:
          cpu: 200m
          memory: 256Mi
          gpu: "0.7"
        limits:
          cpu: 600m
          memory: 1Gi
  automationStrategyRef:
    name: gpu-kai-strategy
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: GpuRebalancingPolicy
metadata:
  name: gpu-kai-rebalancing-policy
  namespace: gpu-kai
spec:
  experimental:
    gpuKaiContract: v1alpha1-2026-07
  scope:
    labelSelector:
      matchLabels:
        app: gpu-kai-demo
  metrics:
    compute:
      upsize:
        thresholdPercent: 125
        metricsWindow: 10m
        maxPercent: 200
      prometheus:
        metric: kubex_gpu_container_sm_utilization_percent
        interpretation: fullGPU
        namespaceLabel: namespace
        podLabel: pod
        containerLabel: container
    memory:
      upsize:
        thresholdPercent: 125
        metricsWindow: 10m
        maxPercent: 200
      prometheus:
        metric: kubex_gpu_container_memory_footprint_percent
        interpretation: currentAllocation
        namespaceLabel: namespace
        podLabel: pod
        containerLabel: container
  automationStrategyRef:
    name: gpu-kai-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-kai-demo
  namespace: gpu-kai
  labels:
    app: gpu-kai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-kai-demo
  template:
    metadata:
      labels:
        app: gpu-kai-demo
        kai.scheduler/queue: "my-queue"
      annotations:
        gpu-fraction: "0.25"
        mock.kubex.ai/gpu-uuid: "GPU-mock-001"
        mock.kubex.ai/kubex_gpu_container_sm_utilization_percent: "72.5"
        mock.kubex.ai/kubex_gpu_container_memory_footprint_percent: "48"
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 700m
              memory: 1200Mi
