---
apiVersion: v1
kind: Namespace
metadata:
  name: automationstrategy-vpa-recommendation-managed
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: AutomationStrategy
metadata:
  name: vpa-strategy
  namespace: automationstrategy-vpa-recommendation-managed
spec:
  safetyChecks:
    enableVpaFilter: true
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: StaticPolicy
metadata:
  name: acs-helm-operator-policy
  namespace: automationstrategy-vpa-recommendation-managed
spec:
  scope:
    labelSelector:
      matchLabels:
        app: acs-helm-operator
  resources:
    containers:
      acs-helm-operator:
        requests:
          cpu: 200m
          memory: 32Mi
        limits:
          cpu: 400m
          memory: 512Mi
  automationStrategyRef:
    name: vpa-strategy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acs-helm-operator
  namespace: automationstrategy-vpa-recommendation-managed
  labels:
    app: acs-helm-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acs-helm-operator
  template:
    metadata:
      labels:
        app: acs-helm-operator
    spec:
      containers:
        - name: acs-helm-operator
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 200m
              memory: 40Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: acs-helm-operator-vpa
  namespace: automationstrategy-vpa-recommendation-managed
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: acs-helm-operator
  updatePolicy:
    minReplicas: 1
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: acs-helm-operator
        minAllowed:
          cpu: 200m
        maxAllowed:
          cpu: 2
  # Reproduces the reported shape:
  # - resourcePolicy constrains only CPU
  # - the pod starts underprovisioned on memory at 40Mi
  # - VPA may still publish recommendations for both CPU and memory
  # Once VPA publishes a memory recommendation for acs-helm-operator,
  # enableVpaFilter should block the StaticPolicy memory downsize to 32Mi,
  # allowing VPA to grow memory instead of Kubex fighting it.
