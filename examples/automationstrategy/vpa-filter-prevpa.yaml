---
# Pre-warm manifest for vpa-filter-default e2e test.
# Contains only the Namespace, Deployment, and VPA — intentionally without
# AutomationStrategy or StaticPolicy.  The test applies this first, waits
# for the VPA to produce a recommendation (RecommendationProvided=True), and
# only then applies the full vpa-filter-default.yaml.  This guarantees the
# VPA filter fires immediately on the first policyevaluation pass so the
# assertion (original resources unchanged) is deterministic.
apiVersion: v1
kind: Namespace
metadata:
  name: automationstrategy-vpa-default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-demo
  namespace: automationstrategy-vpa-default
  labels:
    app: vpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-demo
  template:
    metadata:
      labels:
        app: vpa-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-demo
  namespace: automationstrategy-vpa-default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vpa-demo
  updatePolicy:
    updateMode: Auto
  # No resourcePolicy => VPA manages all containers, CPU+memory
