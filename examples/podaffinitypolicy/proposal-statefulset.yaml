---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: proposal-pod-affinity-demo
  namespace: default
  labels:
    app: proposal-pod-affinity-demo
spec:
  serviceName: proposal-pod-affinity-demo
  replicas: 1
  selector:
    matchLabels:
      app: proposal-pod-affinity-demo
  template:
    metadata:
      labels:
        app: proposal-pod-affinity-demo
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: proposal-pod-affinity-demo
  namespace: default
spec:
  clusterIP: None
  selector:
    app: proposal-pod-affinity-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
