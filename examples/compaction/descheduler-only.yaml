---
# Descheduler-only policy for labelled long-running workloads. Evicted Pods use
# the default scheduler, which does not provide Kubex's MostAllocated bin-packing;
# eviction can free nodes, but replacement placement is not guaranteed to compact.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: descheduler-only-compaction
spec:
  scope:
    labelSelector:
      matchLabels:
        compaction.kubex.ai/enabled: "true"
    namespaceSelector:
      operator: In
      values:
        - batch
    workloadTypes:
      - Deployment
      - StatefulSet
  enabled: true
  setLabelsByEviction: false
  scheduler:
    useKubexScheduler: false
    externalSchedulerName: ""   # empty = no scheduler assignment
  descheduler:
    enabled: true
    interval: "*/10 * * * *"    # run more frequently than the default */30
    maxNoOfPodsToEvictPerNode: 3
    maxNoOfPodsToEvictPerNamespace: 5
    maxNoOfPodsToEvictTotal: 10
    defaultEvictor:
      nodeFit: true
      ignorePvcPods: true
      evictLocalStoragePods: false
