apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: compaction-test
spec:
  scope:
    labelSelector:
      matchLabels:
        team: compaction-test
    namespaceSelector:
      operator: In
      values:
        - compaction-test
    workloadTypes:
      - Deployment
  scheduler:
    useKubexScheduler: true
  descheduler:
    enabled: true
    # Demo-only: run every minute and use aggressive request-based thresholds.
    interval: "* * * * *"
    maxNoOfPodsToEvictPerNode: 2
    maxNoOfPodsToEvictPerNamespace: 2
    maxNoOfPodsToEvictTotal: 2
    highNodeUtilization:
      thresholds:
        cpu: 70
        memory: 70
        pods: 70
