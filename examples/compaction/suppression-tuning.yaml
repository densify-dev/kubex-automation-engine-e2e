---
# Runtime-convergence suppression tuning for setLabelsByEviction. Suppress a
# workload after two same-fingerprint replacement observations within 10 minutes,
# then wait 20 minutes before runtime convergence may replace its Pods again.
#
# These settings govern replacement used to converge existing Pods with
# scheduling intent; they do not tune scheduled descheduler balancing runs.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: tuned-suppression-compaction
spec:
  scope:
    labelSelector:
      matchLabels:
        compaction.kubex.ai/enabled: "true"
    namespaceSelector:
      operator: In
      values:
        - production
    workloadTypes:
      - Deployment
      - StatefulSet
  enabled: true
  setLabelsByEviction: true
  scheduler:
    useKubexScheduler: true
  descheduler:
    enabled: true
    interval: "*/15 * * * *"
    loopDetectionThreshold: 2
    loopDetectionWindow: 10m
    suppressionDuration: 20m
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 1
    maxNoOfPodsToEvictTotal: 3
    defaultEvictor:
      nodeFit: true
      ignorePvcPods: true
