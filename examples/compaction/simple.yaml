---
# Minimal compaction policy: consolidate all Deployments and StatefulSets in the
# "production" namespace onto fewer nodes using the Kubex-managed MostAllocated
# scheduler and descheduler. Nodes below 65% requested CPU, memory, and Pod
# utilization are eligible sources. At most one Pod is evicted per node per run.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: simple-compaction
spec:
  scope:
    namespaceSelector:
      operator: In
      values:
        - production
    workloadTypes:
      - Deployment
      - StatefulSet
  enabled: true
  setLabelsByEviction: true
  scheduler:
    useKubexScheduler: true
  descheduler:
    enabled: true
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 1
    maxNoOfPodsToEvictTotal: 1
    highNodeUtilization:
      numberOfNodes: 0
      thresholds:
        cpu: 65
        memory: 65
        pods: 65
