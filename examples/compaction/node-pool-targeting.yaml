---
# Compaction policy targeting a specific node pool using wildcards.
# Only nodes whose kubex.ai/pool value starts with green- are eligible.
# Add equivalent node affinity to workloads when replacements must stay in this pool.
# Higher weight (100) ensures this policy wins over any lower-priority overlapping policy.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: green-pool-compaction
spec:
  scope:
    labelSelector:
      matchLabels:
        compaction.kubex.ai/node-pool: green
    namespaceSelector:
      operator: In
      values:
        - production
    workloadTypes:
      - Deployment
      - StatefulSet
  enabled: true
  weight: 100
  scheduler:
    useKubexScheduler: true
  descheduler:
    enabled: true
    nodeSelector:
      matchExpressions:
        - key: kubex.ai/pool
          operator: In
          values:
            - "green-*"
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 2
    maxNoOfPodsToEvictTotal: 5
    defaultEvictor:
      nodeFit: true
      ignorePvcPods: true
    highNodeUtilization:
      numberOfNodes: 1
      thresholds:
        cpu: 40
        memory: 40
        pods: 20
