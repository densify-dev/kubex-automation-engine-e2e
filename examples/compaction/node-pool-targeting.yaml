---
# Compaction policy targeting a specific node pool using wildcards.
# Only nodes labelled kubex.ai/pool=green-* are eligible for descheduler activity.
# Higher weight (100) ensures this policy wins over any lower-priority overlapping policy.
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ClusterCompactionPolicy
metadata:
  name: green-pool-compaction
spec:
  scope:
    namespaceSelector:
      operator: NotIn
      values:
        - kube-system
        - kubex
    workloadTypes:
      - Deployment
      - StatefulSet
  enabled: true
  weight: 100
  scheduler:
    useKubexScheduler: true
  descheduler:
    enabled: true
    nodeSelector:
      matchExpressions:
        - key: kubex.ai/pool
          operator: In
          values:
            - green-a
            - green-b
            - green-c
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 2
    maxNoOfPodsToEvictTotal: 5
    defaultEvictor:
      nodeFit: true
      ignorePvcPods: true
    highNodeUtilization:
      numberOfNodes: 1
      thresholds:
        cpu: 40
        memory: 40
        pods: 20
