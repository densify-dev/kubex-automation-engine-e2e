apiVersion: v1
kind: Namespace
metadata:
  name: container-args-replacement
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-args-replacement
  namespace: container-args-replacement
  labels:
    app: container-args-replacement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: container-args-replacement
  template:
    metadata:
      labels:
        app: container-args-replacement
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          args:
            - --mode=old
            - --remove-me
            - stale
            - --before
            - keep
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ContainerArgsPolicy
metadata:
  name: container-args-replacement
spec:
  scope:
    workloadTypes:
      - Deployment
    namespaceSelector:
      operator: In
      values:
        - container-args-replacement
    labelSelector:
      matchLabels:
        app: container-args-replacement
  containers:
    app:
      args:
        - name: --mode
          value: new
        - name: --remove-me
          operation: Remove
        - name: --replacement-flag
  replaceExistingPods: true
  weight: 100
