apiVersion: v1
kind: Namespace
metadata:
  name: container-args-admission
---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: ContainerArgsPolicy
metadata:
  name: container-args-admission
spec:
  scope:
    workloadTypes:
      - Deployment
      - StatefulSet
    namespaceSelector:
      operator: In
      values:
        - container-args-admission
    labelSelector:
      matchLabels:
        app: container-args-admission
  containers:
    "*":
      args:
        - name: --remove-me
          operation: Remove
        - name: --default-flag
        - name: --empty-value
          value: ""
        - name: --shared
          value: wildcard
    server:
      args:
        - name: --shared
          value: server
        - name: --port
          value: "8080"
        - name: -v
          value: "3"
        - name: --repeat
          value: first
        - name: --repeat
          value: second
        # This is an inert argument in this CPU-only example.
        - name: --gpu-memory-utilization
          value: "0.8"
    missing:
      args:
        - name: --never-applied
          value: ignored
  replaceExistingPods: false
  weight: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-args-deployment
  namespace: container-args-admission
  labels:
    app: container-args-admission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: container-args-admission
      workload: deployment
  template:
    metadata:
      labels:
        app: container-args-admission
        workload: deployment
    spec:
      containers:
        - name: server
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          args:
            - --before
            - --shared=old
            - --remove-me
            - stale
            - --remove-me=stale-again
            - --port
            - "9000"
            - --repeat=old
            - --repeat
            - older
            - --after
            - keep
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          args:
            - --shared
            - worker-old
            - --remove-me=stale
            - --unrelated
            - keep
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: container-args-statefulset
  namespace: container-args-admission
  labels:
    app: container-args-admission
spec:
  serviceName: container-args-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: container-args-admission
      workload: statefulset
  template:
    metadata:
      labels:
        app: container-args-admission
        workload: statefulset
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          args:
            - --before
            - --shared
            - stateful-old
            - --remove-me=stale
            - --empty-value=old
            - -v
            - "1"
            - --after
            - keep
---
apiVersion: v1
kind: Service
metadata:
  name: container-args-statefulset
  namespace: container-args-admission
spec:
  clusterIP: None
  selector:
    app: container-args-admission
    workload: statefulset
  ports:
    - name: sleep
      port: 80
      targetPort: 80
