---
apiVersion: rightsizing.kubex.ai/v1alpha1
kind: BackoffPolicy
metadata:
  name: backoffpolicy-sample
  namespace: default
spec:
  scope:
    labelSelector:
      matchLabels:
        app: backoff-demo
  weight: 0
  adoptionThresholdPercent: 75
  rollbackTarget: manifest
  monitoringPeriod: 5m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoff-demo
  namespace: default
  labels:
    app: backoff-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backoff-demo
  template:
    metadata:
      labels:
        app: backoff-demo
    spec:
      containers:
        - name: demo
          image: nginx:1.27
          ports:
            - containerPort: 80
