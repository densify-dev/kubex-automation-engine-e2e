name: E2E Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      controller_image_repository:
        description: "Docker image repository override for the controller"
        required: false
        default: ""
      controller_image_tag:
        description: "Docker image tag override for the controller"
        required: false
        default: ""
      controller_chart_repo_url:
        description: "Helm repo URL that serves the controller charts"
        required: false
        default: https://densify-dev.github.io/helm-charts
      controller_chart_version:
        description: "Helm chart version override for kubex-automation-engine"
        required: false
        default: ""
      crds_chart_version:
        description: "Helm chart version override for kubex-crds"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: "E2E Tests (${{ matrix.kubernetes.version }}, multi-policy: ${{ matrix.kubernetes.multi_policy_container_rightsizing_enabled }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - version: v1.35.0
            cluster_name: e2e-135
            with_metrics_server: "true"
            with_keda: "true"
            with_vpa: "true"
            gpu_suite: "true"
            gpu_kind_config: features/gpu/kind-config.yaml
            multi_policy_container_rightsizing_enabled: "false"
          - version: v1.32.0
            cluster_name: e2e-132
            with_metrics_server: "true"
            with_keda: "false"
            with_vpa: "false"
            gpu_suite: "true"
            gpu_kind_config: features/gpu/kind-config.yaml
            multi_policy_container_rightsizing_enabled: "false"
          - version: v1.35.0
            cluster_name: e2e-135
            with_metrics_server: "true"
            with_keda: "true"
            with_vpa: "true"
            gpu_suite: "true"
            gpu_kind_config: features/gpu/kind-config.yaml
            multi_policy_container_rightsizing_enabled: "true"
          - version: v1.32.0
            cluster_name: e2e-132
            with_metrics_server: "true"
            with_keda: "false"
            with_vpa: "false"
            gpu_suite: "true"
            gpu_kind_config: features/gpu/kind-config.yaml
            multi_policy_container_rightsizing_enabled: "true"
    env:
      # Push/pull_request use local charts and metadata; schedule uses the latest Helm chart defaults.
      HELM_RELEASE: kubex-automation-engine
      HELM_NAMESPACE: kubex
      KUBEX_E2E_EPASSWORD: ${{ secrets.KUBEX_E2E_EPASSWORD }}
      CONTROLLER_IMAGE_REPOSITORY: ${{ github.event_name == 'schedule' && '' || github.event.inputs.controller_image_repository }}
      CONTROLLER_IMAGE_TAG: ${{ github.event_name == 'schedule' && '' || github.event.inputs.controller_image_tag }}
      HELM_REPO_URL: ${{ github.event.inputs.controller_chart_repo_url || 'https://densify-dev.github.io/helm-charts' }}
      HELM_CRDS_CHART: ${{ github.event_name == 'schedule' && 'kubex/kubex-crds' || 'charts/kubex-crds' }}
      HELM_CONTROLLER_CHART: ${{ github.event_name == 'schedule' && 'kubex/kubex-automation-engine' || 'charts/kubex-automation-engine' }}
      HELM_CRDS_CHART_VERSION: ${{ github.event_name == 'schedule' && '' || github.event.inputs.crds_chart_version }}
      HELM_CONTROLLER_CHART_VERSION: ${{ github.event_name == 'schedule' && '' || github.event.inputs.controller_chart_version }}
      CLUSTER_NAME: ${{ matrix.kubernetes.cluster_name }}
      NODE_IMAGE: kindest/node:${{ matrix.kubernetes.version }}
      WITH_METRICS_SERVER: ${{ matrix.kubernetes.with_metrics_server }}
      WITH_KEDA: ${{ matrix.kubernetes.with_keda }}
      WITH_VPA: ${{ matrix.kubernetes.with_vpa }}
      GPU_SUITE: ${{ matrix.kubernetes.gpu_suite }}
      GPU_KIND_CONFIG: ${{ matrix.kubernetes.gpu_kind_config }}
      MULTI_POLICY_CONTAINER_RIGHTSIZING_ENABLED: ${{ matrix.kubernetes.multi_policy_container_rightsizing_enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load controller image metadata
        if: github.event_name != 'schedule'
        uses: ./.github/actions/load-controller-image-metadata

      - name: Show run parameters
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes.version }}
        run: |
          printf 'Trigger: %q\n' "$GITHUB_EVENT_NAME"
          printf 'Kubernetes version: %q\n' "$KUBERNETES_VERSION"
          printf 'Cluster name: %q\n' "$CLUSTER_NAME"
          printf 'Node image: %q\n' "$NODE_IMAGE"
          printf 'Metrics server: %q\n' "$WITH_METRICS_SERVER"
          printf 'KEDA: %q\n' "$WITH_KEDA"
          printf 'VPA: %q\n' "$WITH_VPA"
          printf 'GPU suite: %q\n' "$GPU_SUITE"
          printf 'GPU kind config: %q\n' "$GPU_KIND_CONFIG"
          printf 'Multi-policy container rightsizing: %q\n' "$MULTI_POLICY_CONTAINER_RIGHTSIZING_ENABLED"
          printf 'Controller image repository (override or metadata): %q\n' "$CONTROLLER_IMAGE_REPOSITORY"
          printf 'Controller image tag (override or metadata): %q\n' "$CONTROLLER_IMAGE_TAG"
          printf 'Helm release: %q\n' "$HELM_RELEASE"
          printf 'Helm namespace: %q\n' "$HELM_NAMESPACE"
          printf 'Helm repo URL: %q\n' "$HELM_REPO_URL"
          printf 'Helm CRDs chart: %q\n' "$HELM_CRDS_CHART"
          printf 'Helm CRDs chart version: %q\n' "$HELM_CRDS_CHART_VERSION"
          printf 'Helm controller chart: %q\n' "$HELM_CONTROLLER_CHART"
          printf 'Helm controller chart version: %q\n' "$HELM_CONTROLLER_CHART_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install -r requirements.txt

      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          expected_sha="$(curl -fsSL https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64.sha256sum | awk '{print $1}')"
          echo "${expected_sha}  /tmp/kind" | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate e2e password secret
        run: |
          if [[ -z "${KUBEX_E2E_EPASSWORD:-}" ]]; then
            echo "KUBEX_E2E_EPASSWORD secret is required"
            exit 1
          fi

      - name: Run full suite
        run: ./run-full-suite.sh
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          NODE_IMAGE: ${{ env.NODE_IMAGE }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          HELM_NAMESPACE: ${{ env.HELM_NAMESPACE }}
          CONTROLLER_IMAGE_REPOSITORY: ${{ env.CONTROLLER_IMAGE_REPOSITORY }}
          CONTROLLER_IMAGE_TAG: ${{ env.CONTROLLER_IMAGE_TAG }}
          HELM_REPO_URL: ${{ env.HELM_REPO_URL }}
          HELM_CRDS_CHART: ${{ env.HELM_CRDS_CHART }}
          HELM_CONTROLLER_CHART: ${{ env.HELM_CONTROLLER_CHART }}
          HELM_CRDS_CHART_VERSION: ${{ env.HELM_CRDS_CHART_VERSION }}
          HELM_CONTROLLER_CHART_VERSION: ${{ env.HELM_CONTROLLER_CHART_VERSION }}
          WITH_METRICS_SERVER: ${{ env.WITH_METRICS_SERVER }}
          WITH_KEDA: ${{ env.WITH_KEDA }}
          WITH_VPA: ${{ env.WITH_VPA }}
          MULTI_POLICY_CONTAINER_RIGHTSIZING_ENABLED: ${{ env.MULTI_POLICY_CONTAINER_RIGHTSIZING_ENABLED }}
