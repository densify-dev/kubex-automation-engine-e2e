name: Load controller image metadata
description: Load the controller image repository and tag from metadata.json when workflow inputs are empty.
inputs:
  metadata-path:
    description: Path to the metadata.json file.
    required: false
    default: metadata.json
runs:
  using: composite
  steps:
    - shell: python
      run: |
        import json
        import os
        import uuid
        from pathlib import Path

        needs_repo = not os.environ.get("CONTROLLER_IMAGE_REPOSITORY")
        needs_tag = not os.environ.get("CONTROLLER_IMAGE_TAG")

        if not needs_repo and not needs_tag:
            raise SystemExit(0)

        metadata_path = Path("${{ inputs.metadata-path }}")
        if not metadata_path.is_file():
            raise SystemExit(f"{metadata_path} is required")

        metadata = json.loads(metadata_path.read_text())
        env_path = Path(os.environ["GITHUB_ENV"])
        lines = []
        if needs_repo:
            lines.append(("CONTROLLER_IMAGE_REPOSITORY", metadata["controller_image_repository"]))
        if needs_tag:
            lines.append(("CONTROLLER_IMAGE_TAG", metadata["controller_image_tag"]))

        if lines:
            delimiter = uuid.uuid4().hex
            with env_path.open("a") as handle:
                for key, value in lines:
                    handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
