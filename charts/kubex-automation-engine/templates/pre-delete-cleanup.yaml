{{- /*
pre-delete-cleanup.yaml

Helm pre-delete hook that clears finalizers from chart-owned custom resources.
VllmOptimizationPolicies are deleted normally and the hook waits for their controller
finalizers to restore workloads before uninstalling the controller.
*/}}
{{- $cleanupImageTag := .Values.cleanup.image.tag | default .Values.image.tag -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
  namespace: {{ include "kubex-automation-engine.namespace" . }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
- apiGroups:
  - rightsizing.kubex.ai
  resources:
  - automationstrategies
  - clusterautomationstrategies
  - clustercompactionpolicies
  - clusterobjectpatches
  - clustergpureactivepolicies
  - clusterproactivepolicies
  - clusterrollbackpolicies
  - clusterstaticpolicies
  - globalconfigurations
  - gpuconsolidationpolicies
  - gpureactivepolicies
  - objectpatches
  - podaffinitypolicies
  - containerargspolicies
  - policyevaluations
  - proactivepolicies
  - rollbackpolicies
  - staticpolicies
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - rightsizing.kubex.ai
  resources:
  - vllmoptimizationpolicies
  verbs:
  - get
  - list
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
  namespace: {{ include "kubex-automation-engine.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubex-automation-engine.cleanupHookName" . }}
  namespace: {{ include "kubex-automation-engine.namespace" . }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "kubex-automation-engine.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kubex-automation-engine.cleanupHookName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.openshift.enabled .Values.cleanup.podSecurityContext }}
      securityContext:
        {{- if .Values.cleanup.podSecurityContext }}
        {{- toYaml .Values.cleanup.podSecurityContext | nindent 8 }}
        {{- end }}
        {{- if and .Values.openshift.enabled (not (hasKey .Values.cleanup.podSecurityContext "runAsNonRoot")) }}
        runAsNonRoot: true
        {{- end }}
        {{- if and .Values.openshift.enabled (not (hasKey .Values.cleanup.podSecurityContext "seccompProfile")) }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      {{- end }}
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image.repository }}:{{ required "cleanup.image.tag or image.tag must be set to an immutable cleanup image tag" $cleanupImageTag }}
        imagePullPolicy: {{ .Values.cleanup.image.pullPolicy | default "IfNotPresent" }}
        securityContext:
          {{- toYaml .Values.cleanup.securityContext | nindent 10 }}
        env:
        - name: HELM_RELEASE_NAME
          value: {{ .Release.Name }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
