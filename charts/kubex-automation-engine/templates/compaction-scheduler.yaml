{{- if .Values.compactionScheduler.enabled -}}
{{- include "kubex-automation-engine.validateCompactionSchedulerVersion" . -}}
{{- $resourceName := printf "%s-compaction-scheduler" (include "kubex-automation-engine.fullname" .) -}}
{{- $configName := printf "%s-compaction-scheduler-config" (include "kubex-automation-engine.fullname" .) -}}
{{- $imageTag := include "kubex-automation-engine.compactionSchedulerImageTag" . -}}
{{- $openshiftFsGroupConfigured := and .Values.openshift.enabled (not (empty .Values.openshift.fsGroup)) -}}
{{- $hasPodFsGroup := hasKey .Values.compactionScheduler.podSecurityContext "fsGroup" -}}
{{- $hasEffectiveFsGroup := or $hasPodFsGroup $openshiftFsGroupConfigured -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $resourceName }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $resourceName }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $resourceName }}
    namespace: {{ include "kubex-automation-engine.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  labels:
    {{- include "kubex-automation-engine.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubex-automation-engine.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: compaction-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubex-automation-engine.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: compaction-scheduler
    spec:
      serviceAccountName: {{ $resourceName }}
      {{- with .Values.compactionScheduler.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.compactionScheduler.podSecurityContext | nindent 8 }}
        {{- if and $openshiftFsGroupConfigured (not $hasPodFsGroup) }}
        fsGroup: {{ .Values.openshift.fsGroup }}
        {{- end }}
        {{- if and $hasEffectiveFsGroup .Values.openshift.enabled (not (hasKey .Values.compactionScheduler.podSecurityContext "fsGroupChangePolicy")) (not (empty .Values.openshift.fsGroupChangePolicy)) }}
        fsGroupChangePolicy: {{ .Values.openshift.fsGroupChangePolicy }}
        {{- end }}
        {{- if and .Values.openshift.enabled .Values.openshift.supplementalGroups }}
        supplementalGroups:
          {{- toYaml .Values.openshift.supplementalGroups | nindent 10 }}
        {{- end }}
      containers:
        - name: kube-scheduler
          image: {{ .Values.compactionScheduler.image.repository }}:{{ $imageTag }}
          imagePullPolicy: {{ .Values.compactionScheduler.image.pullPolicy }}
          command:
            - kube-scheduler
          args:
            - --config=/etc/kubernetes/scheduler-config.yaml
          securityContext:
            {{- toYaml .Values.compactionScheduler.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.compactionScheduler.resources | nindent 12 }}
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/kubernetes
      volumes:
        - name: scheduler-config
          configMap:
            name: {{ $configName }}
{{- end -}}
