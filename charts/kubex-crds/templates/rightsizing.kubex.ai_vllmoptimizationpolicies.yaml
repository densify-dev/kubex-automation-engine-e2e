---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vllmoptimizationpolicies.rightsizing.kubex.ai
spec:
  group: rightsizing.kubex.ai
  names:
    kind: VllmOptimizationPolicy
    listKind: VllmOptimizationPolicyList
    plural: vllmoptimizationpolicies
    singular: vllmoptimizationpolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VllmOptimizationPolicy controls adaptive vLLM configuration optimization
          for one workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VllmOptimizationPolicy.
            properties:
              adaptation:
                default: {}
                description: adaptation defines monitoring and rescan behavior.
                properties:
                  monitorInterval:
                    default: 5m
                    description: monitorInterval is the cadence for checking the selected
                      configuration.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  rescanInterval:
                    default: 6h
                    description: rescanInterval is the maximum time between optimization
                      searches.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  stableFor:
                    default: 15m
                    description: stableFor is the duration a traffic change or violation
                      must persist before a new search.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  trafficChangeThresholdPercent:
                    default: 20
                    description: trafficChangeThresholdPercent is the relative change
                      that triggers traffic adaptation.
                    type: number
                    x-kubernetes-validations:
                    - message: trafficChangeThresholdPercent must be greater than
                        zero
                      rule: self > 0
                type: object
                x-kubernetes-validations:
                - message: stableFor must be at least monitorInterval
                  rule: '!has(self.stableFor) || !has(self.monitorInterval) || duration(self.stableFor)
                    >= duration(self.monitorInterval)'
              constraints:
                description: constraints defines absolute latency limits.
                properties:
                  maxP95InterTokenLatency:
                    description: maxP95InterTokenLatency is the maximum allowed p95
                      inter-token latency.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  maxP95TTFT:
                    description: maxP95TTFT is the maximum allowed p95 time to first
                      token.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                required:
                - maxP95InterTokenLatency
                - maxP95TTFT
                type: object
              evaluation:
                description: evaluation defines measurement windows and minimum sample
                  sizes.
                properties:
                  baselineWindow:
                    description: baselineWindow is the duration used to measure the
                      selected configuration before a search.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  cooldown:
                    description: cooldown is the minimum time between candidate changes.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                  maxTrialsPerSearch:
                    default: 12
                    description: maxTrialsPerSearch limits candidate attempts, including
                      failed and deferred trials.
                    format: int32
                    minimum: 1
                    type: integer
                  minFinishedRequests:
                    description: minFinishedRequests is the minimum number of completed
                      requests required in a measurement window.
                    format: int64
                    minimum: 1
                    type: integer
                  trialWindow:
                    description: trialWindow is the duration used to measure each
                      candidate or monitor the selected configuration.
                    type: string
                    x-kubernetes-validations:
                    - message: must be greater than 0 seconds
                      rule: duration(self) > duration('0s')
                required:
                - baselineWindow
                - cooldown
                - minFinishedRequests
                - trialWindow
                type: object
              experimentOrder:
                description: experimentOrder selects experimental improvements and
                  sets their priority.
                items:
                  description: VllmParameterName identifies a supported vLLM parameter.
                  enum:
                  - maxNumBatchedTokens
                  - maxNumSeqs
                  type: string
                maxItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: experimentOrder must not contain duplicate names
                  rule: self.all(parameter, self.exists_one(other, parameter == other))
              formulaOrder:
                description: formulaOrder selects formula improvements and sets their
                  execution order.
                items:
                  description: VllmParameterName identifies a supported vLLM parameter.
                  enum:
                  - maxNumBatchedTokens
                  - maxNumSeqs
                  type: string
                maxItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: formulaOrder must not contain duplicate names
                  rule: self.all(parameter, self.exists_one(other, parameter == other))
              objective:
                default: {}
                description: objective defines the weighted score and regression budgets.
                properties:
                  gpuComputeUtilization:
                    default:
                      direction: Maximize
                      weight: 25
                    description: gpuComputeUtilization scores GPU compute utilization.
                    properties:
                      direction:
                        description: direction indicates whether higher or lower values
                          are better.
                        enum:
                        - Maximize
                        - Minimize
                        type: string
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - direction
                    - weight
                    type: object
                  gpuMemoryFootprint:
                    default:
                      direction: Minimize
                      weight: 25
                    description: gpuMemoryFootprint scores GPU memory footprint.
                    properties:
                      direction:
                        description: direction indicates whether higher or lower values
                          are better.
                        enum:
                        - Maximize
                        - Minimize
                        type: string
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - direction
                    - weight
                    type: object
                  minScoreGain:
                    default: 2
                    description: minScoreGain is the minimum weighted score improvement
                      required to accept a candidate.
                    type: number
                    x-kubernetes-validations:
                    - message: minScoreGain must be greater than zero
                      rule: self > 0
                  p50TTFT:
                    default:
                      weight: 25
                    description: p50TTFT scores the median time to first token.
                    properties:
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - weight
                    type: object
                  p95InterTokenLatency:
                    default:
                      weight: 0
                    description: p95InterTokenLatency scores the 95th percentile inter-token
                      latency.
                    properties:
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - weight
                    type: object
                  p95TTFT:
                    default:
                      weight: 0
                    description: p95TTFT scores the 95th percentile time to first
                      token.
                    properties:
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - weight
                    type: object
                  throughput:
                    default:
                      weight: 25
                    description: throughput scores generated-token throughput.
                    properties:
                      maxRegressionPercent:
                        description: |-
                          maxRegressionPercent is the largest allowed relative regression. Omit it to disable the cap.
                          An explicit zero forbids any regression.
                        minimum: 0
                        type: number
                      weight:
                        description: weight controls the metric's share of the weighted
                          score.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - weight
                    type: object
                type: object
                x-kubernetes-validations:
                - message: at least one objective weight must be greater than zero
                  rule: '!has(self.throughput) || !has(self.p50TTFT) || !has(self.p95TTFT)
                    || !has(self.p95InterTokenLatency) || !has(self.gpuComputeUtilization)
                    || !has(self.gpuMemoryFootprint) || self.throughput.weight + self.p50TTFT.weight
                    + self.p95TTFT.weight + self.p95InterTokenLatency.weight + self.gpuComputeUtilization.weight
                    + self.gpuMemoryFootprint.weight > 0'
              parameters:
                description: parameters defines the supported search spaces.
                properties:
                  maxNumBatchedTokens:
                    description: maxNumBatchedTokens defines the search range for
                      --max-num-batched-tokens.
                    properties:
                      max:
                        description: max is the highest value the controller may apply.
                        format: int64
                        minimum: 2
                        type: integer
                      min:
                        description: min is the lowest value the controller may apply.
                        format: int64
                        minimum: 1
                        type: integer
                      step:
                        description: |-
                          step is the maximum change between adjacent in-range trial values.
                          Entering the range from an out-of-range selection uses the nearest boundary, regardless of step.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - max
                    - min
                    - step
                    type: object
                    x-kubernetes-validations:
                    - message: min must be less than max
                      rule: self.min < self.max
                  maxNumSeqs:
                    description: maxNumSeqs defines the sequence-count bounds and
                      formula sizing basis.
                    properties:
                      max:
                        description: max is the highest sequence count the formula
                          may select.
                        format: int64
                        minimum: 1
                        type: integer
                      min:
                        description: min is the lowest sequence count the formula
                          may select.
                        format: int64
                        minimum: 1
                        type: integer
                      sizingBasis:
                        description: sizingBasis selects the token length used to
                          estimate per-sequence cache blocks.
                        enum:
                        - ObservedMean
                        - MaxModelLen
                        type: string
                    required:
                    - max
                    - min
                    - sizingBasis
                    type: object
                    x-kubernetes-validations:
                    - message: min must be less than or equal to max
                      rule: self.min <= self.max
                type: object
                x-kubernetes-validations:
                - message: at least one supported parameter is required
                  rule: has(self.maxNumBatchedTokens) || has(self.maxNumSeqs)
              prometheus:
                default: {}
                description: |-
                  prometheus selects metric families and scrape labels. URL and timeout come from GlobalConfiguration.
                  The empty-object default also applies nested metric and label defaults when this block is omitted.
                properties:
                  containerLabel:
                    description: containerLabel scopes metric queries to a container
                      when the scrape includes that label.
                    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    type: string
                  finishedRequestsCounter:
                    default: vllm:request_success_total
                    description: finishedRequestsCounter is a Prometheus counter for
                      completed requests.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  generatedTokensCounter:
                    default: vllm:generation_tokens_total
                    description: generatedTokensCounter is a Prometheus counter for
                      generated tokens.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  gpuComputeUtilizationCounter:
                    default: kubex_gpu_container_sm_utilization_percent_seconds_total
                    description: gpuComputeUtilizationCounter is the Prometheus counter
                      for accumulated GPU compute utilization in percent-seconds.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  gpuContainerLabel:
                    default: container
                    description: gpuContainerLabel scopes GPU metric queries to a
                      container.
                    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    type: string
                  gpuDeviceLabel:
                    default: gpu_uuid
                    description: gpuDeviceLabel identifies individual GPUs in GPU
                      metric queries.
                    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    type: string
                  gpuMemoryFootprintGauge:
                    default: kubex_gpu_container_memory_footprint_percent
                    description: gpuMemoryFootprintGauge is the Prometheus gauge family
                      for GPU memory footprint.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  interTokenLatencyHistogram:
                    default: vllm:inter_token_latency_seconds
                    description: interTokenLatencyHistogram is a classic Prometheus
                      histogram family.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  namespaceLabel:
                    default: namespace
                    description: namespaceLabel is the namespace label used to scope
                      metric queries.
                    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    type: string
                  podLabel:
                    default: pod
                    description: podLabel is the pod label used to scope metric queries.
                    pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    type: string
                  requestGenerationTokensHistogram:
                    default: vllm:request_generation_tokens
                    description: requestGenerationTokensHistogram is a classic histogram
                      family for generated-token counts.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  requestPromptTokensHistogram:
                    default: vllm:request_prompt_tokens
                    description: requestPromptTokensHistogram is a classic histogram
                      family for prompt-token counts.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  runningRequestsGauge:
                    default: vllm:num_requests_running
                    description: runningRequestsGauge is the Prometheus gauge family
                      for running requests.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  timeToFirstTokenHistogram:
                    default: vllm:time_to_first_token_seconds
                    description: timeToFirstTokenHistogram is a classic Prometheus
                      histogram family.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                  waitingRequestsGauge:
                    default: vllm:num_requests_waiting
                    description: waitingRequestsGauge is the Prometheus gauge family
                      for waiting requests.
                    pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                    type: string
                type: object
              target:
                description: target identifies the exact workload and cannot change
                  after creation.
                properties:
                  apiVersion:
                    description: apiVersion is the target workload API version.
                    type: string
                  container:
                    description: container identifies the vLLM serving container.
                    minLength: 1
                    type: string
                  kind:
                    description: kind is the target workload kind.
                    type: string
                  name:
                    description: name is the target workload name.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the target workload namespace.
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: target is immutable
                  rule: self == oldSelf
                - message: target must be an apps/v1 Deployment or kubeai.org/v1 Model
                  rule: (self.apiVersion == 'apps/v1' && self.kind == 'Deployment')
                    || (self.apiVersion == 'kubeai.org/v1' && self.kind == 'Model')
              trafficComparison:
                default: {}
                description: trafficComparison defines how traffic windows are compared.
                properties:
                  minBackloggedFraction:
                    default: 0.8
                    description: minBackloggedFraction is the minimum waiting-request
                      fraction considered sufficiently backlogged.
                    type: number
                    x-kubernetes-validations:
                    - message: minBackloggedFraction must be greater than zero and
                        at most one
                      rule: self > 0 && self <= 1
                  tolerancePercent:
                    default: 10
                    description: tolerancePercent is the allowed relative change in
                      demand-limited completed-request rate and request lengths.
                    maximum: 100
                    minimum: 0
                    type: number
                type: object
            required:
            - adaptation
            - constraints
            - evaluation
            - experimentOrder
            - formulaOrder
            - objective
            - parameters
            - target
            - trafficComparison
            type: object
            x-kubernetes-validations:
            - message: at least one formula or experiment improvement must be enabled
              rule: self.formulaOrder.size() > 0 || self.experimentOrder.size() >
                0
            - message: formulaOrder may include maxNumSeqs only when its formula settings
                are configured
              rule: self.formulaOrder.all(parameter, parameter == 'maxNumSeqs' &&
                has(self.parameters.maxNumSeqs))
            - message: experimentOrder may include maxNumBatchedTokens only when its
                experiment settings are configured
              rule: self.experimentOrder.all(parameter, parameter == 'maxNumBatchedTokens'
                && has(self.parameters.maxNumBatchedTokens))
          status:
            description: status reports observed optimization state.
            properties:
              cleanup:
                description: cleanup tracks restoration and child-policy deletion.
                properties:
                  childDeleteRequested:
                    description: childDeleteRequested records that the child policy
                      should be deleted.
                    type: boolean
                  needsReplacement:
                    description: needsReplacement records whether cleanup must replace
                      pods.
                    type: boolean
                  previousPodUIDs:
                    description: previousPodUIDs identifies pods that must be replaced
                      before cleanup completes.
                    items:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  started:
                    description: started records whether finalizer cleanup has begun.
                    type: boolean
                type: object
              conditions:
                description: conditions summarize the policy state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              containerName:
                description: containerName is the serving container selected from
                  the target's pods.
                type: string
              currentMeasurement:
                description: currentMeasurement is the latest valid measurement for
                  the selected configuration.
                properties:
                  backloggedFraction:
                    description: backloggedFraction is the fraction of the window
                      with waiting requests.
                    type: number
                  finishedRequests:
                    description: finishedRequests is the total number of completed
                      requests in the window.
                    format: int64
                    type: integer
                  generatedTokensPerSecondMilli:
                    description: generatedTokensPerSecondMilli is generated tokens
                      per second scaled by 1000.
                    format: int64
                    type: integer
                  meanGPUComputeUtilization:
                    description: meanGPUComputeUtilization is the mean GPU compute
                      utilization in the window.
                    type: number
                  meanGPUMemoryFootprint:
                    description: meanGPUMemoryFootprint is the mean GPU memory footprint
                      in the window.
                    type: number
                  meanOutputTokens:
                    description: meanOutputTokens is the mean generated length in
                      the window.
                    type: number
                  meanPromptTokens:
                    description: meanPromptTokens is the mean prompt length in the
                      window.
                    type: number
                  meanRunningRequests:
                    description: meanRunningRequests is the mean number of running
                      requests in the window.
                    type: number
                  meanWaitingRequests:
                    description: meanWaitingRequests is the mean number of waiting
                      requests in the window.
                    type: number
                  observedAt:
                    description: observedAt is when the window was measured.
                    format: date-time
                    type: string
                  p50TimeToFirstToken:
                    description: p50TimeToFirstToken is the aggregate p50 latency
                      across the ready pods.
                    type: string
                  p95InterTokenLatency:
                    description: p95InterTokenLatency is the aggregate p95 latency
                      across the ready pods.
                    type: string
                  p95TimeToFirstToken:
                    description: p95TimeToFirstToken is the aggregate p95 latency
                      across the ready pods.
                    type: string
                  podMeasurements:
                    description: podMeasurements stores formula inputs for each pod
                      in the measurement window.
                    items:
                      description: VllmPodMeasurement stores formula inputs for one
                        serving pod.
                      properties:
                        blockSize:
                          description: blockSize is the number of tokens in each KV
                            cache block.
                          format: int64
                          type: integer
                        formulaInputError:
                          description: formulaInputError explains why this pod's formula
                            inputs could not be used.
                          type: string
                        maxModelLen:
                          description: maxModelLen is the explicitly configured maximum
                            context length for this pod.
                          format: int64
                          type: integer
                        meanOutputTokens:
                          description: meanOutputTokens is the mean generated length
                            observed for this pod.
                          type: number
                        meanPromptTokens:
                          description: meanPromptTokens is the mean prompt length
                            observed for this pod.
                          type: number
                        numGPUBlocks:
                          description: numGPUBlocks is the number of available KV
                            cache blocks reported by vLLM.
                          format: int64
                          type: integer
                        pod:
                          description: pod identifies the serving pod.
                          type: string
                      required:
                      - pod
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - pod
                    x-kubernetes-list-type: map
                  podUIDs:
                    description: podUIDs identifies the pods included in this measurement.
                    items:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  windowDuration:
                    description: windowDuration is the exact measurement window length.
                    type: string
                required:
                - finishedRequests
                - generatedTokensPerSecondMilli
                - observedAt
                - p50TimeToFirstToken
                - p95InterTokenLatency
                - p95TimeToFirstToken
                - windowDuration
                type: object
              declaredConfiguration:
                description: |-
                  declaredConfiguration captures controlled arguments from the workload spec, separately from runtime tuning.
                  Nil means not captured; a Remove operation means the argument was declared absent.
                properties:
                  arguments:
                    description: arguments lists the argument operations that make
                      up this configuration.
                    items:
                      description: ContainerArgsPolicyArgument describes one named
                        container argument operation.
                      properties:
                        name:
                          description: name is the literal option name, such as --flag
                            or -f.
                          minLength: 2
                          pattern: ^--?[^\s=]+$
                          type: string
                        operation:
                          default: AddOrUpdate
                          description: operation controls whether the option is added/updated
                            or removed.
                          enum:
                          - AddOrUpdate
                          - Remove
                          type: string
                        value:
                          description: value is optional. Omitted value means a valueless
                            flag; an explicit empty value is preserved.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              initialMeasurement:
                description: initialMeasurement is the historical measurement collected
                  before tuning.
